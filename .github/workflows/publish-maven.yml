name: Publish maven

on: [ push ]
jobs:
  release:
    name: Publish release JAR for Kore
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, '[Maven]') || github.event_name == 'workflow_dispatch'"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
        with:
          retry: 10

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: site
          path: site

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Update site
        run: |
          ./gradlew publishAllPublicationsToMavenRepository
          cd ./site
          git config user.name "augustomegener"
          git config user.email "76854495+AugustoMegener@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "Update site" && git push)